version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: bambifound-postgres
    restart: always
    environment:
      POSTGRES_USER: bambi_user
      POSTGRES_PASSWORD: bambi_pass
      POSTGRES_DB: bambifound_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bambi_user -d bambifound_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: bambifound-mailpit
    restart: always
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
    volumes:
      - mailpit_data:/data

volumes:
  postgres_data:
  mailpit_data:
