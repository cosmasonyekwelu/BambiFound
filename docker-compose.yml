services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: bambifound-postgres
    restart: always
    environment:
      POSTGRES_USER: bambi_user
      POSTGRES_PASSWORD: bambi_pass
      POSTGRES_DB: bambifound_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bambi_user -d bambifound_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: bambifound-mailpit
    restart: always
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
    volumes:
      - mailpit_data:/data

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: bambifound-server
    restart: always
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: "postgresql://bambi_user:bambi_pass@postgres:5432/bambifound_db?sslmode=disable"
      DIRECT_URL: "postgresql://bambi_user:bambi_pass@postgres:5432/bambifound_db?sslmode=disable"
      JWT_SECRET: "bambifound_docker_jwt_secret_key_2025"
      JWT_REFRESH_SECRET: "bambifound_docker_jwt_refresh_secret_key_2025"
      FRONTEND_URL: "http://localhost:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  mailpit_data:
